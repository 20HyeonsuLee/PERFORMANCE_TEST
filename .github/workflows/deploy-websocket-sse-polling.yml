name: Deploy WebSocket-SSE-Polling

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'websocket-sse-polling/**'
      - '.github/workflows/deploy-websocket-sse-polling.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - dev
          - prod

env:
  MODULE_NAME: websocket-sse-polling
  DOCKER_IMAGE_NAME: websocket-sse-polling

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Verify Java installation
      run: |
        echo "JAVA_HOME: $JAVA_HOME"
        java -version
        which java

    - name: Build with Gradle
      run: ./gradlew :${{ env.MODULE_NAME }}:build -x test --no-daemon --stacktrace

    - name: Run tests
      run: ./gradlew :${{ env.MODULE_NAME }}:test --no-daemon --stacktrace

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ${{ env.MODULE_NAME }}/build/reports/tests/test/

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: jar-file
        path: ${{ env.MODULE_NAME }}/build/libs/*.jar

  build-docker-image:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./${{ env.MODULE_NAME }}/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max

  deploy-to-server:
    needs: build-docker-image
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/${{ env.MODULE_NAME }}

          # Save current image as backup (if exists)
          if docker images ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest -q | grep -q .; then
            docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest \
                       ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:previous || true
          fi

          # Pull latest image
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest

          # Stop and remove old container
          docker compose down || true

          # Start new container
          docker compose up -d

          # Clean up old images
          docker image prune -f

    - name: Wait for service to start
      run: sleep 10

    - name: Health check
      run: |
        MAX_RETRIES=30
        RETRY_COUNT=0

        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          if curl -f http://${{ secrets.SERVER_HOST }}:8080/actuator/health; then
            echo "✅ Health check passed"
            exit 0
          fi

          echo "⏳ Waiting for service to be healthy... ($((RETRY_COUNT + 1))/$MAX_RETRIES)"
          RETRY_COUNT=$((RETRY_COUNT + 1))
          sleep 10
        done

        echo "❌ Health check failed after $MAX_RETRIES attempts"
        exit 1

    - name: Rollback on failure
      if: failure()
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/${{ env.MODULE_NAME }}
          echo "🔄 Rolling back to previous version..."

          # Stop current container
          docker compose down || true

          # Check if previous image exists
          if docker images ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:previous -q | grep -q .; then
            echo "Previous image found, restoring..."
            docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:previous \
                       ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            docker compose up -d
          else
            echo "⚠️  No previous image found. This might be the first deployment."
          fi

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'performance-test'

scrape_configs:
  # Kafka JMX metrics
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9999']
    scrape_interval: 10s

  - job_name: 'performance'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['43.200.188.232:8080']
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
